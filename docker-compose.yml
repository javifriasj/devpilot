version: '3.8'
services:
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "3000:3000"
